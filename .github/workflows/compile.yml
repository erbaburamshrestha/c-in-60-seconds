name: Compile all episodes

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile every main.c with warnings as errors
        run: |
          status=0
          for f in $(find . -name 'main.c' | sort); do
            echo "::group::$f"
            if gcc -Wall -Wextra -Werror -std=c99 -D_POSIX_C_SOURCE=200809L -D_DEFAULT_SOURCE "$f" -o /tmp/ep -lm; then
              echo "OK: $f"
            else
              echo "::error file=$f::Compilation failed"
              status=1
            fi
            echo "::endgroup::"
          done
          exit $status
